[package]
name = "sm_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "sm_core"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
crypto_box = { version = "0.9", features = ["std"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
# HKDF (RFC 5869) для ротации идентификаторов обнаружения. Тот же RustCrypto,
# что hmac и sha2 — своя реализация вывода ключей была бы лишним риском.
hkdf = "0.12"
sha2 = "0.10"
# Проверка подписи /server/info. Уже в дереве через ratchet-core — новой загрузки нет.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }  # шифрованный SQLite (SQLCipher), OpenSSL вшит — кросс-компиляция iOS/Android без системных зависимостей
ureq = { version = "2.10", features = ["json"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
thiserror = "1"
aether-ratchet-core = { path = "ratchet-core" } # единый чистый Olm/Double Ratchet слой для native + web

[profile.release]
opt-level = "s"
lto = true
