[package]
name = "aether-ratchet-core"
version = "0.1.0"
edition = "2021"

[features]
wasm = ["vodozemac/js"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vodozemac = { version = "0.10.0", default-features = false, features = ["experimental-session-config"] }
# Мастер-ключ аккаунта (cross-signing устройств, P8) — выводится из box-приватника,
# поэтому подпись живёт вне Olm-аккаунта устройства.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
